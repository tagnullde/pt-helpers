# Window
remember_window_size  no
initial_window_width  260c
initial_window_height 65c
window_padding_width  4

# Appearance
background_opacity 0.85
background_blur    1

# Title
wayland_titlebar_color background

# Scrollback
scrollback_lines 50000

# Copy/Paste
copy_on_select clipboard

# Terminal
term xterm-256color

# Shell
shell fish

# Session
startup_session ~/.config/kitty/session.conf

# Menu Bar
tab_bar_edge            bottom
tab_bar_style           powerline
tab_bar_min_tabs        1
tab_powerline_style     slanted
tab_title_template      " {index}: {title} "
active_tab_font_style   normal
inactive_tab_font_style normal
active_tab_foreground   #fcfcfc
active_tab_background   #1d99f3
inactive_tab_foreground #7f8c8d
inactive_tab_background #1a1a1a
tab_bar_background      #000000

# Tabs
map alt+t             new_tab_with_cwd
map alt+w             close_tab
map alt+shift+n       set_tab_title
map alt+1             goto_tab 1
map alt+2             goto_tab 2
map alt+3             goto_tab 3
map alt+4             goto_tab 4
map alt+5             goto_tab 5

# Colors
foreground #20c20e
background #000000
font_size        9.5
color0  #000000
color1  #ed1515
color2  #1cdc9a
color3  #f67400
color4  #1d99f3
color5  #9b59b6
color6  #1abc9c
color7  #fcfcfc
color8  #7f8c8d
color9  #c0392b
color10 #1cdc9a
color11 #fdbc4b
color12 #3daee9
color13 #8e44ad
color14 #16a085
color15 #ffffff
